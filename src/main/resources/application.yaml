spring:
  application:
    name: jfm-backend

  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/jfm.db

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
