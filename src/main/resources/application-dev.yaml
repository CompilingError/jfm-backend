server:
  port: 8080

spring:
  application:
    name: jfm-backend

  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/jfm-dev.db

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    csrf:
      enabled: true

